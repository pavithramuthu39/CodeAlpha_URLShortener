databases:
  - name: codealpha-urlshortener-db
    databaseName: urlshortener
    user: urlshortener
    plan: free

services:
  - type: web
    name: codealpha-urlshortener
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codealpha-urlshortener-db
          property: connectionString
